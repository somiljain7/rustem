[package]
name = "embed-service"
version = "0.1.0"
edition = "2021"
description = "CPU-optimized multilingual text embedding service using ONNX Runtime"

[dependencies]
# ONNX Runtime - pinned to exact version
ort = { version = "=2.0.0-rc.9", features = ["load-dynamic"] }

# Tokenization
tokenizers = { version = "=0.21.1", features = [] }

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"

# Async / server
tokio = { version = "1.44", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["json"] }
tower = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Caching
lru = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Timing
hdrhistogram = "7.5"

# Utils
anyhow = "1.0"
ndarray = "0.16"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Note: `target-cpu` is not a Cargo profile key. For a machine-specific build use
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
# (not portable across CPUs).

[profile.release.build-override]
opt-level = 3

[[bench]]
name = "throughput"
harness = false
